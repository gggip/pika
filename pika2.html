<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>比卡超成語大亂鬥 (雙人版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            overflow: hidden;
            touch-action: none;
            background-color: #f0fdf4;
            user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .pixel-font {
            font-weight: 900;
            text-shadow: 2px 2px 0px #000;
        }

        /* 簡單的撞擊特效 */
        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }
        .bump-anim {
            animation: bump 0.2s ease-out;
        }

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body class="bg-green-100 h-screen w-screen relative">

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay (In Game) -->
    <div id="gameUI" class="absolute inset-0 pointer-events-none hidden flex flex-col justify-between p-4 z-10">
        <!-- Top Bar -->
        <div class="flex justify-between items-start w-full">
            <!-- P1 Score -->
            <div class="bg-yellow-400 border-4 border-yellow-600 rounded-xl p-3 shadow-lg transform -rotate-2 relative">
                <div class="absolute -top-3 -left-2 bg-white border-2 border-yellow-600 rounded-full p-1 w-8 h-8 flex items-center justify-center text-xs font-bold z-10">P1</div>
                <p class="text-yellow-900 font-bold text-xs">比卡超</p>
                <p id="p1Score" class="text-3xl text-white pixel-font text-center">0</p>
            </div>

            <!-- Question Box -->
            <div class="bg-white/95 backdrop-blur border-4 border-blue-500 rounded-2xl px-4 py-2 shadow-xl text-center transform min-w-[200px]">
                 <p class="text-gray-500 text-[10px] font-bold">請接住缺字！</p>
                 <h1 id="idiomDisplay" class="text-3xl md:text-5xl font-black text-gray-800 tracking-widest whitespace-nowrap">
                    等待中...
                </h1>
            </div>
            
            <!-- P2 Score -->
            <div class="bg-purple-400 border-4 border-purple-600 rounded-xl p-3 shadow-lg transform rotate-2 relative">
                 <div class="absolute -top-3 -right-2 bg-white border-2 border-purple-600 rounded-full p-1 w-8 h-8 flex items-center justify-center text-xs font-bold z-10">P2</div>
                <p class="text-purple-900 font-bold text-xs">謎擬Q</p>
                <p id="p2Score" class="text-3xl text-white pixel-font text-center">0</p>
            </div>
        </div>

        <!-- Room Info (Bottom) -->
        <div class="text-center">
             <span class="bg-black/20 text-white px-3 py-1 rounded-full text-xs font-mono" id="roomCodeDisplay">ROOM: ----</span>
        </div>
    </div>

    <!-- Lobby Screen -->
    <div id="lobbyScreen" class="absolute inset-0 bg-gradient-to-br from-yellow-300 to-purple-400 flex flex-col items-center justify-center z-50 p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center border-8 border-white/50">
            <h1 class="text-4xl font-black text-blue-600 mb-2 tracking-tight">⚡ 成語大亂鬥 ⚡</h1>
            <p class="text-gray-500 mb-6 font-bold">雙人推擠對戰版</p>

            <div id="authSection" class="mb-4">
                 <p class="text-gray-400 text-sm loading-dots">正在連線伺服器</p>
            </div>

            <div id="menuSection" class="hidden space-y-4">
                <button id="createBtn" class="w-full bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-4 rounded-xl shadow-lg border-b-4 border-yellow-600 active:border-b-0 active:translate-y-1 transition text-lg">
                    <i class="fas fa-plus-circle"></i> 建立房間
                </button>
                
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">或是</span>
                    </div>
                </div>

                <div class="flex gap-2">
                    <input type="text" id="roomInput" placeholder="輸入房號 (4碼)" maxlength="4" class="flex-1 bg-gray-100 border-2 border-gray-300 rounded-xl px-4 py-2 text-center font-bold text-xl uppercase focus:outline-none focus:border-blue-500">
                    <button id="joinBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold px-6 py-2 rounded-xl shadow-lg border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 transition">
                        加入
                    </button>
                </div>
            </div>

            <div id="waitingSection" class="hidden text-center py-4">
                <div class="animate-spin text-4xl text-blue-500 mb-4"><i class="fas fa-spinner"></i></div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">等待對手加入...</h3>
                <p class="text-3xl font-mono font-black bg-gray-100 py-2 rounded-lg mb-4 select-all" id="generatedRoomCode">----</p>
                <p class="text-sm text-gray-500">請將此號碼告訴你的朋友</p>
            </div>
        </div>
    </div>
    
    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="hidden absolute inset-0 bg-black/85 flex flex-col items-center justify-center z-50 pointer-events-auto">
        <div class="bg-white p-8 rounded-3xl border-8 border-gray-300 max-w-md w-[90%] text-center shadow-2xl animate-bounce">
            <h2 class="text-4xl font-black text-gray-800 mb-2" id="winnerText">XXX 獲勝！</h2>
            <div class="flex justify-center gap-8 my-6">
                <div class="text-center">
                    <p class="text-xs font-bold text-gray-500">P1</p>
                    <p class="text-2xl font-bold text-yellow-600" id="endScoreP1">0</p>
                </div>
                <div class="text-center">
                    <p class="text-xs font-bold text-gray-500">P2</p>
                    <p class="text-2xl font-bold text-purple-600" id="endScoreP2">0</p>
                </div>
            </div>
            <button onclick="location.reload()" class="bg-blue-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-blue-600 transition">
                回到大廳
            </button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, increment, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Configuration & Global Variables ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pikachu-battle';
        
        let currentUser = null;
        let roomId = null;
        let isHost = false;
        let unsubscribeRoom = null;
        
        // Game State
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 成語資料庫
        const idioms = [
            { text: "一石二＿", answer: "鳥", decoys: ["魚", "馬", "蟲"] },
            { text: "守株待＿", answer: "兔", decoys: ["虎", "龍", "豬"] },
            { text: "畫蛇添＿", answer: "足", decoys: ["手", "頭", "尾"] },
            { text: "對牛彈＿", answer: "琴", decoys: ["吉", "鼓", "笛"] },
            { text: "虎頭蛇＿", answer: "尾", decoys: ["頭", "腳", "身"] },
            { text: "亡羊補＿", answer: "牢", decoys: ["衣", "網", "屋"] },
            { text: "井底之＿", answer: "蛙", decoys: ["魚", "蛇", "鳥"] },
            { text: "三心兩＿", answer: "意", decoys: ["手", "腳", "頭"] },
            { text: "雪中送＿", answer: "炭", decoys: ["水", "冰", "花"] },
            { text: "一鳴驚＿", answer: "人", decoys: ["天", "地", "鬼"] },
            { text: "車水馬＿", answer: "龍", decoys: ["虎", "獅", "豹"] },
            { text: "五花八＿", answer: "門", decoys: ["路", "街", "道"] },
            { text: "狐假虎＿", answer: "威", decoys: ["背", "爪", "牙"] },
            { text: "畫龍點＿", answer: "睛", decoys: ["頭", "尾", "鱗"] },
            { text: "盲人摸＿", answer: "象", decoys: ["虎", "馬", "牛"] },
            { text: "入木三＿", answer: "分", decoys: ["寸", "尺", "丈"] },
            { text: "雞飛狗＿", answer: "跳", decoys: ["叫", "跑", "走"] },
            { text: "打草驚＿", answer: "蛇", decoys: ["鳥", "兔", "虎"] },
            { text: "順手牽＿", answer: "羊", decoys: ["牛", "馬", "狗"] },
            { text: "膽小如＿", answer: "鼠", decoys: ["兔", "雞", "貓"] }
        ];

        let gameState = {
            status: 'menu', // menu, waiting, playing, gameover
            items: [], // local items
            p1: { x: 100, score: 0, connected: false },
            p2: { x: 300, score: 0, connected: false },
            currentIdiom: idioms[0],
            winner: null
        };

        // Local Player Settings
        let localPlayer = {
            role: null, // 'p1' or 'p2'
            x: 0,
            y: 0, // set in resize
            vx: 0,
            width: 80,
            height: 80,
            maxSpeed: 10,
            friction: 0.9,
            targetX: null,
            lastSync: 0
        };

        // Assets
        const imgP1 = new Image();
        imgP1.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/25.svg'; // Pikachu
        
        const imgP2 = new Image();
        imgP2.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/778.svg'; // Mimikyu (Rival)

        // --- Authentication ---
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Auth failed", e);
            }
        }
        
        initAuth();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('menuSection').classList.remove('hidden');
                console.log("Logged in:", user.uid);
            }
        });

        // --- Room Logic ---

        // Generate a random 4 digit code
        function generateRoomCode() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        async function createRoom() {
            if (!currentUser) return;
            
            const code = generateRoomCode();
            roomId = code;
            isHost = true;
            localPlayer.role = 'p1';
            localPlayer.x = canvas.width * 0.25;

            // Initial State in Firestore
            try {
                // FIX: Added 'rooms' collection segment to ensure even number of path segments
                // Path: artifacts/{appId}/public/data/rooms/{roomId}
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', room_${roomId}), {
                    hostId: currentUser.uid,
                    status: 'waiting',
                    createdAt: Date.now(),
                    currentIdiomIndex: 0,
                    spawnEvent: null, // Host writes { id, type, text, x, vy, isCorrect } here
                    p1: { x: localPlayer.x, score: 0, connected: true },
                    p2: { x: 0, score: 0, connected: false }
                });

                document.getElementById('menuSection').classList.add('hidden');
                document.getElementById('waitingSection').classList.remove('hidden');
                document.getElementById('generatedRoomCode').innerText = roomId;
                
                subscribeToRoom();

            } catch (e) {
                console.error("Error creating room:", e);
                alert("建立房間失敗，請重試");
            }
        }

        async function joinRoom() {
            if (!currentUser) return;
            const input = document.getElementById('roomInput');
            const code = input.value.trim();
            
            if (code.length !== 4) {
                alert("請輸入4位數房號");
                return;
            }

            roomId = code;
            isHost = false;
            localPlayer.role = 'p2';
            localPlayer.x = canvas.width * 0.75;

            try {
                // FIX: Added 'rooms' collection segment
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', room_${roomId});
                const roomSnap = await getDoc(roomRef);

                if (!roomSnap.exists()) {
                    alert("房間不存在");
                    return;
                }

                if (roomSnap.data().status !== 'waiting') {
                    alert("遊戲已經開始或結束");
                    return;
                }

                // Update P2 status
                await updateDoc(roomRef, {
                    'p2.connected': true,
                    'p2.x': localPlayer.x,
                    status: 'playing' // Start game immediately upon join
                });

                document.getElementById('lobbyScreen').classList.add('hidden');
                document.getElementById('gameUI').classList.remove('hidden');
                document.getElementById('roomCodeDisplay').innerText = ROOM: ${roomId};
                
                subscribeToRoom();
                startGameLoop();

            } catch (e) {
                console.error("Error joining:", e);
                alert("加入失敗");
            }
        }

        function subscribeToRoom() {
            if (unsubscribeRoom) unsubscribeRoom();

            // FIX: Added 'rooms' collection segment
            unsubscribeRoom = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', room_${roomId}), (doc) => {
                if (!doc.exists()) return;
                const data = doc.data();

                // Sync Remote Player Position & Score
                if (localPlayer.role === 'p1') {
                    if (data.p2) {
                        gameState.p2.x = data.p2.x; // P2 is remote
                        gameState.p2.score = data.p2.score;
                        gameState.p2.connected = data.p2.connected;
                        // Start game if waiting and P2 joins
                        if (gameState.status === 'menu' && data.status === 'playing') {
                            startGame();
                        }
                    }
                } else {
                    if (data.p1) {
                        gameState.p1.x = data.p1.x; // P1 is remote
                        gameState.p1.score = data.p1.score;
                        gameState.p1.connected = data.p1.connected;
                    }
                }

                // Sync Game State
                if (data.status === 'playing' && gameState.status !== 'playing') {
                    startGame();
                }

                // Handle Question Change
                if (data.currentIdiomIndex !== undefined) {
                    gameState.currentIdiom = idioms[data.currentIdiomIndex % idioms.length];
                    document.getElementById('idiomDisplay').innerText = gameState.currentIdiom.text;
                }

                // Handle Spawn Events (Host spawns, Guest receives)
                if (!isHost && data.spawnEvent && data.spawnEvent.id !== lastSpawnId) {
                    spawnItemFromEvent(data.spawnEvent);
                    lastSpawnId = data.spawnEvent.id;
                }

                // Update UI Scores
                document.getElementById('p1Score').innerText = data.p1?.score || 0;
                document.getElementById('p2Score').innerText = data.p2?.score || 0;
                
                // Win Condition
                if (data.status === 'gameover') {
                    endGame(data.winner);
                }

            }, (error) => {
                console.error("Firestore sync error:", error);
            });
        }

        // --- Game Logic ---

        let lastSpawnId = null;
        let lastSyncTime = 0;
        let animationFrameId;

        function startGame() {
            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('gameUI').classList.remove('hidden');
            gameState.status = 'playing';
            resizeCanvas();
            
            if (isHost) {
                // Host starts the spawning loop
                hostLoop();
            }
            
            startGameLoop();
        }

        // Only Host runs this to generate items
        function hostLoop() {
            if (gameState.status !== 'playing') return;
            
            // Randomly spawn item every 1-2 seconds
            setTimeout(() => {
                if (gameState.status !== 'playing') return;
                
                const idiom = gameState.currentIdiom;
                const isCorrect = Math.random() < 0.4; // 40% chance correct answer
                const text = isCorrect ? idiom.answer : idiom.decoys[Math.floor(Math.random() * idiom.decoys.length)];
                
                const event = {
                    id: Date.now() + Math.random(),
                    text: text,
                    isCorrect: isCorrect,
                    x: Math.random() * (canvas.width - 60) + 30,
                    vy: 3 + Math.random() * 2 // Speed
                };

                // Write to DB
                // FIX: Added 'rooms' collection segment
                updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', room_${roomId}), {
                    spawnEvent: event
                }).catch(console.error);
                
                // Spawn locally for Host too
                spawnItemFromEvent(event);

                hostLoop();
            }, 1000 + Math.random() * 1000);
        }

        function spawnItemFromEvent(event) {
            gameState.items.push({
                ...event,
                y: -50,
                radius: 35,
                active: true
            });
        }

        function syncPosition() {
            const now = Date.now();
            // Rate limit updates to 100ms
            if (now - lastSyncTime > 100) {
                const field = localPlayer.role === 'p1' ? 'p1.x' : 'p2.x';
                // FIX: Added 'rooms' collection segment
                updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', room_${roomId}), {
                    [field]: localPlayer.x
                }).catch(e => {}); // Ignore minor errors
                lastSyncTime = now;
            }
        }

        async function handleScore(isCorrect) {
            // Optimistic UI update handled by listener
            const field = localPlayer.role === 'p1' ? 'p1.score' : 'p2.score';
            const change = isCorrect ? 10 : -5;
            
            try {
                // FIX: Added 'rooms' collection segment
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', room_${roomId}), {
                    [field]: increment(change)
                });
                
                if (isCorrect && isHost) {
                    // Host changes question if correct answer caught
                    const nextIndex = Math.floor(Math.random() * idioms.length);
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', room_${roomId}), {
                        currentIdiomIndex: nextIndex
                    });
                }
            } catch (e) {
                console.error("Score update failed", e);
            }
        }

        function endGame(winner) {
            gameState.status = 'gameover';
            cancelAnimationFrame(animationFrameId);
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('winnerText').innerText = winner === 'p1' ? '比卡超 獲勝！' : '謎擬Q 獲勝！';
            document.getElementById('winnerText').className = winner === 'p1' ? 'text-4xl font-black text-yellow-600 mb-2' : 'text-4xl font-black text-purple-600 mb-2';
            
            // Final sync scores
            document.getElementById('endScoreP1').innerText = document.getElementById('p1Score').innerText;
            document.getElementById('endScoreP2').innerText = document.getElementById('p2Score').innerText;
        }

        // --- Physics & Drawing ---

        function startGameLoop() {
            function loop() {
                if (gameState.status !== 'playing') return;
                
                update();
                draw();
                animationFrameId = requestAnimationFrame(loop);
            }
            loop();
        }

        function update() {
            // 1. Move Local Player
            if (localPlayer.targetX !== null) {
                const dx = localPlayer.targetX - (localPlayer.x + localPlayer.width/2);
                localPlayer.x += dx * 0.15;
                if(Math.abs(dx) < 1) localPlayer.targetX = null;
            } else {
                localPlayer.x += localPlayer.vx;
                localPlayer.vx *= localPlayer.friction;
            }

            // Boundaries
            if (localPlayer.x < 0) { localPlayer.x = 0; localPlayer.vx = 0; }
            if (localPlayer.x + localPlayer.width > canvas.width) { localPlayer.x = canvas.width - localPlayer.width; localPlayer.vx = 0; }

            // 2. Collision with Other Player (Pushing!)
            // We only effect OURSELVES. If we hit the ghost of the other player, we bounce back.
            const otherX = localPlayer.role === 'p1' ? gameState.p2.x : gameState.p1.x;
            const myCenter = localPlayer.x + localPlayer.width/2;
            const otherCenter = otherX + localPlayer.width/2; // Assume same width
            const dist = Math.abs(myCenter - otherCenter);
            
            // Collision threshold
            if (dist < localPlayer.width * 0.😎 {
                // Determine direction
                if (myCenter < otherCenter) {
                    // I am to the left, push me left
                    localPlayer.vx = -15; // Strong push
                    localPlayer.x -= 5;
                } else {
                    // I am to the right, push me right
                    localPlayer.vx = 15;
                    localPlayer.x += 5;
                }
            }

            // Sync if moved
            if (Math.abs(localPlayer.vx) > 0.1 || localPlayer.targetX !== null) {
                syncPosition();
            }

            // 3. Update Items
            gameState.items.forEach(item => {
                if (!item.active) return;
                item.y += item.vy;

                // Collision with Local Player
                const dx = item.x - (localPlayer.x + localPlayer.width/2);
                const dy = item.y - (localPlayer.y + localPlayer.height/2);
                const distance = Math.hypot(dx, dy);

                if (distance < item.radius + 40) {
                    // Caught!
                    item.active = false;
                    handleScore(item.isCorrect);
                    
                    // Visual feedback
                    createParticles(item.x, item.y, item.isCorrect ? '#FFD700' : '#888');
                }

                // Remove if off screen
                if (item.y > canvas.height + 50) item.active = false;
            });
            
            // Cleanup inactive items
            gameState.items = gameState.items.filter(i => i.active);

            // Check Win Condition (First to 200 or something? Let's just play endless for now or until host ends)
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground
            ctx.fillStyle = '#bbf7d0';
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

            // Draw Items
            gameState.items.forEach(item => {
                ctx.save();
                ctx.translate(item.x, item.y);
                
                // Pokeball Style
                ctx.beginPath();
                ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#FFF';
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, item.radius, Math.PI, 0);
                ctx.fillStyle = item.isCorrect ? '#ef4444' : '#3b82f6';
                ctx.fill();
                ctx.stroke();

                // Text
                ctx.fillStyle = 'white';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(item.text, 0, -40);

                ctx.restore();
            });

            // Draw Players
            drawPlayer(localPlayer.x, localPlayer.y, localPlayer.role === 'p1' ? imgP1 : imgP2, true);
            
            // Draw Remote Player
            const remoteX = localPlayer.role === 'p1' ? gameState.p2.x : gameState.p1.x;
            const remoteImg = localPlayer.role === 'p1' ? imgP2 : imgP1;
            // Simple interpolation for smooth visual of remote player
            // But for simplicity in this file, we just draw raw X. 
            // Better: remoteVisualX = lerp(remoteVisualX, remoteX, 0.1)
            drawPlayer(remoteX, localPlayer.y, remoteImg, false);

            // Draw Particles
            updateAndDrawParticles();
        }

        function drawPlayer(x, y, img, isLocal) {
            ctx.save();
            ctx.translate(x + 40, y + 40);
            
            // Shadow
            ctx.beginPath();
            ctx.ellipse(0, 45, 30, 10, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fill();

            // Image
            if (img.complete) {
                ctx.drawImage(img, -40, -40, 80, 80);
            } else {
                ctx.fillStyle = 'yellow';
                ctx.fillRect(-40, -40, 80, 80);
            }

            // Indicator
            if (isLocal) {
                ctx.beginPath();
                ctx.moveTo(0, -50);
                ctx.lineTo(-10, -60);
                ctx.lineTo(10, -60);
                ctx.fillStyle = localPlayer.role === 'p1' ? '#EAB308' : '#A855F7';
                ctx.fill();
            }

            ctx.restore();
        }

        // --- Particles ---
        let particles = [];
        function createParticles(x, y, color) {
            for(let i=0; i<15; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1,
                    color
                });
            }
        }
        function updateAndDrawParticles() {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            particles = particles.filter(p => p.life > 0);
        }

        // --- Input & Resize ---
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            localPlayer.y = canvas.height - 120;
        }
        window.addEventListener('resize', resizeCanvas);

        // Input
        function handleInput(clientX) {
            if (gameState.status !== 'playing') return;
            localPlayer.targetX = clientX;
        }

        canvas.addEventListener('mousemove', e => handleInput(e.clientX));
        canvas.addEventListener('touchmove', e => { e.preventDefault(); handleInput(e.touches[0].clientX); }, { passive: false });
        canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput(e.touches[0].clientX); }, { passive: false });

        // Buttons
        document.getElementById('createBtn').addEventListener('click', createRoom);
        document.getElementById('joinBtn').addEventListener('click', joinRoom);

    </script>
</body>
